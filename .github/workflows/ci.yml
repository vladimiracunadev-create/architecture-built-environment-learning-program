# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Currículo y sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias de build
        run: python -m pip install -r requirements-build.txt
      - name: Verificar documentación curricular
        run: python scripts/generate_curriculum_docs.py --check
      - name: Verificar decisiones por clase
        run: python scripts/build_pedagogical_decisions.py --check
      - name: Verificar capa pedagógica
        run: python scripts/apply_pedagogy.py --check
      - name: Auditar decisiones pedagógicas
        run: python scripts/audit_pedagogical_traceability.py --json
      - name: Verificar bibliografía derivada
        run: python scripts/build_bibliography.py --check
      - name: Validar fuentes
        run: python scripts/validate_repo.py
      - name: Generar 800 páginas HTML
        run: python scripts/build_site.py
      - name: Validar salida
        run: python scripts/validate_repo.py
      - name: Resumen
        if: always()
        run: |
          echo "### Arquitectura · programa integral" >> "$GITHUB_STEP_SUMMARY"
          echo "- Clases esperadas: **800**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Partes esperadas: **80**" >> "$GITHUB_STEP_SUMMARY"
          echo "- README de parte esperados: **80**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Talleres verticales: **10** · sesiones: **60**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rutas con diagnóstico y capstone: **33**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Anatomía común de clase: **800/800**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cadenas pedagógicas específicas: **800/800**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pilotos editoriales manuales profundos: **5**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recursos transversales esperados: **755**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuentes externas únicas esperadas: **627**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Usos de fuentes contextualmente completos: **1.126/2.179** (mínimo sin regresión)" >> "$GITHUB_STEP_SUMMARY"
