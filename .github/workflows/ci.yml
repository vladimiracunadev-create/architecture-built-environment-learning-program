# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Currículo y sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependencias de build
        run: python -m pip install -r requirements-build.txt
      - name: Verificar documentación curricular
        run: python scripts/generate_curriculum_docs.py --check
      - name: Verificar decisiones por clase
        run: python scripts/build_pedagogical_decisions.py --check
      - name: Verificar capa pedagógica
        run: python scripts/apply_pedagogy.py --check
      - name: Auditar decisiones pedagógicas
        run: python scripts/audit_pedagogical_traceability.py --json
      - name: Auditar diferencias entre las clases
        run: python scripts/audit_class_distinctness.py --check
      - name: Verificar bibliografía derivada
        run: python scripts/build_bibliography.py --check
      - name: Validar fuentes
        run: python scripts/validate_repo.py
      - name: Validar plantillas de presupuesto
        run: python scripts/validate_homeowner_budget.py
      - name: Validar casos de catástrofes, RUTA-35 y cálculos didácticos
        run: python scripts/validate_resilience.py
      - name: Generar páginas HTML del sitio
        run: python scripts/build_site.py
      - name: Validar salida
        run: python scripts/validate_repo.py
      - name: Resumen
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          program = json.load(open("data/program.json", encoding="utf-8"))
          decisions = json.load(open("data/pedagogical-decisions-generated.json", encoding="utf-8"))
          classes, parts = program["class_count"], program["part_count"]
          print("### Arquitectura · programa integral")
          print(f"- Clases esperadas: **{classes}**")
          print(f"- Partes esperadas: **{parts}**")
          print(f"- README de parte esperados: **{parts}**")
          print(f"- Talleres verticales: **{program['studio_count']}** · sesiones: **{program['studio_session_count']}**")
          print(f"- Rutas con diagnóstico y capstone: **{program['route_count']}**")
          print(f"- Anatomía común de clase: **{classes}/{classes}**")
          print(f"- Cadenas pedagógicas específicas: **{decisions['decision_count']}/{classes}**")
          print(f"- Pilotos editoriales manuales profundos: **{len(decisions['manual_editorial_pilots'])}**")
          print("- Fuentes externas y usos: **derivados y verificados desde las clases**")
          print("- Presupuestos de vivienda y ampliación: **esquema y cálculos validados**")
          print("- Casos de catástrofes, RUTA-35 y cálculos de la Parte 84: **validados estructural y aritméticamente**")
          PY
